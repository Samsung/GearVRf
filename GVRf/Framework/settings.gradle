        include ':ksensor_savr'
        project(':ksensor_savr').projectDir=new File(KSENSOR_SRC_PATH)
	} else {
        include ':ksensor'
        project(':ksensor').projectDir=new File(KSENSOR_SRC_PATH)
	}
}

